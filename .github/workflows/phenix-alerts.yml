name: Phenix Infinity - alertas

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Enviar un mensaje de prueba a Telegram"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"
      timezone: "America/Santiago"

permissions:
  contents: read

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Enviar la alerta que corresponde
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST_ALERT: ${{ inputs.test }}
        run: python scripts/github_alerts.py
